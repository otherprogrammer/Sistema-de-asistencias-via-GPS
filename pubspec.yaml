name: flutter_gps
description: Sistema de control de asistencia para obras de construcción

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase dependencies
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.5

  # Location services
  geolocator: ^10.1.0
  permission_handler: ^11.0.1

  # State management & utilities
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2

  # Nuevas librerías para diseño moderno
  animate_do: ^3.3.4
  glassmorphism: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1

  camera: ^0.10.5+5
  tflite_flutter: ^0.11.0
  image: ^4.1.3
  google_mlkit_face_detection: ^0.10.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/mobilefacenet.tflite
    - assets/faces/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_android_white.png"
  min_sdk_android: 21
  # Icono adaptativo para Android 8+
  adaptive_icon_background: "#2D6EA4"
  adaptive_icon_foreground: "assets/images/logo_android_white.png"
  adaptive_icon_foreground_inset: 24.0
